server:
  port: 8080

spring:
  application:
    name: appointments-ws

  datasource:
    url: jdbc:postgresql://localhost:5432/appointments
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: info
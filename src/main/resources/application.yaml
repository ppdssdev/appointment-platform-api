server:
  port: 8080

spring:
  application:
    name: appointments-ws

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointments}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    username: ${APP_USERNAME:portfolio}
    password: ${APP_PASSWORD:change-me}
    tenant-id: ${APP_TENANT_ID:00000000-0000-0000-0000-000000000001}
    jwt-secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
    token-ttl: PT1H
